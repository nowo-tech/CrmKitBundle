# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    versioning-strategy: widen
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    reviewers:
      - "HecFranco"
    labels:
      - "dependencies"
      - "php"
    groups:
      symfony:
        patterns:
          - "symfony/*"
      phpstan:
        patterns:
          - "phpstan/*"
          - "rector/rector"
    commit-message:
      prefix: "chore(deps):"

  # REQ-GH-002: the import modal's TypeScript toolchain. A bump changes the build, so the companion workflow
  # (dependabot-assets.yml, REQ-GH-003) rebuilds src/Resources/public/js and build-info.json on the PR, and the
  # dist-freshness check of ci.yml keeps passing.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 3
    reviewers:
      - "HecFranco"
    labels:
      - "dependencies"
      - "javascript"
    ignore:
      # Wait until typescript-eslint supports TS 7 (it rejects it: "typescript-eslint does not support TS 7.0").
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      build:
        patterns:
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "jsdom"
      lint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript"
          - "typescript-eslint"
          - "@types/*"
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 3
    reviewers:
      - "HecFranco"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci):"

  - package-ecosystem: "composer"
    directory: "/demo/symfony8"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "demo"
    groups:
      demo:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps):"
