            $ref: '#/components/schemas/Affiliation'
        next_cursor:
          type:
            - string
            - 'null'
    AffiliationAnswer:
      allOf:
        -
          $ref: '#/components/schemas/Affiliation'
        -
          $ref: '#/components/schemas/WriteFlags'
    NextAction:
      type: object
      required:
        - id
        - subject_type
        - subject_id
        - due_at
        - status
        - task
        - text
      properties:
