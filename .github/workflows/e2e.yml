# REQ-DEMO-013 — Playwright e2e of the management UI against the running demo/symfony8 (FrankenPHP worker, MySQL):
# a sales user creates a company and a contact, links a host project, adds a note and imports a CSV; access control
# (login redirect, 403), a custom field, and no horizontal scroll at phone width.
name: Demo e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Light mode (docs/GITHUB_CI.md#light-mode-for-deps-and-docs-only-prs): no workflow-level paths-ignore (it would leave
  # the required check pending forever); the job below is skipped instead, and a skipped job reports as passed.
  changes:
    name: Change scope (e2e)
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Classify the change
        id: classify
        uses: nowo-tech/ci-actions/changes@v1
        with:
          mode-variable: ${{ vars.NOWO_CI_PR_MODE }}

  e2e:
    name: Demo symfony8 Playwright e2e
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Start the demo
        run: make -C demo up-symfony8

      - name: Playwright e2e
        run: make test-e2e

      - name: Demo logs on failure
        if: failure()
        run: docker compose -f demo/symfony8/docker-compose.yml logs --tail=200 || true

      - name: Stop the demo
        if: always()
        run: make -C demo down-symfony8
