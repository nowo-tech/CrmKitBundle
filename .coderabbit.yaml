# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for nowo-tech/CrmKitBundle.
# Requires the CodeRabbit GitHub App installed on nowo-tech/CrmKitBundle.
# Manual review: comment `@coderabbitai review` on a pull request.

language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  commit_status: true
  poem: false
  collapse_walkthrough: true
  sequence_diagrams: true
  changed_files_summary: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 10
    drafts: false
    base_branches:
      - main
      - master
    ignore_title_keywords:
      - WIP
      - "[skip review]"

  path_filters:
    - "!**/vendor/**"
    - "!**/coverage/**"
    - "!**/*.lock"
    - "!phpstan-baseline.neon"
    - "!.cursor/**"
    - "src/**"
    - "tests/**"
    - "docs/**"
    - "demo/**"
    - ".github/**"
    - "*.md"
    - "*.yaml"
    - "*.yml"
    - "Makefile"

  path_instructions:
    - path: "src/**/*.php"
      instructions: |
        nowo-tech/crm-kit-bundle (docs/CONTRACT.md). Review against the contract and BUNDLES_FIX_RULES: public ports are interfaces + value objects with no Doctrine / Symfony / HTTP types, the bundle never flushes the host EntityManager, events are dispatched after commit and carry ids, identifier and key columns compare exactly (binary NO PAD collations utf8mb4_0900_bin / utf8mb4_nopad_bin, PHP === re-check), every service checks tenant, feature gate, actor and permission itself (deny by default, 404 across tenants, 403 inside), every write is a transaction-doctrine write unit (lock conflicts 409 CONFLICT_001 / CONFLICT_002 with X-Conflict-Code, domain conflicts 409 with their own code), plan limits by atomic counters (never COUNT then insert), worker mode without kernel reset (no request state in services), audit and logs carry ids and counts only (no names, e-mails or note text), notes and record data are rendered escaped (no raw HTML), CSV exports neutralise formula cells, GDPR erasure keeps consent rows without evidence.
        Follow PSR-12 and `.php-cs-fixer.dist.php`. Prefer PHP 8 attributes over annotations.
        Respect PHP and Symfony ranges in `composer.json` when present. Preserve backward compatibility unless the PR explicitly breaks it.
        Use strict comparison (`===`) where appropriate. Keep changes minimal and consistent with existing patterns.
        Align with `composer cs-check`, `composer phpstan`, and `composer test` when those scripts exist.

    - path: "tests/**/*.php"
      instructions: |
        PHPUnit tests for this package. Add or update tests for new behaviour.
        Match existing test structure (Unit vs Integration). Avoid trivial assertions.
        Ensure changes remain compatible with the CI matrix when one is defined.

    - path: "docs/**/*.md"
      instructions: |
        User-facing documentation in English under `docs/`. Do not invent features, versions, or commands.
        For notable releases, keep CHANGELOG and UPGRADING aligned. Preserve document structure and tone.

    - path: "demo/**/*.php"
      instructions: |
        Demo applications illustrate bundle usage — not production code.
        Keep demos aligned with supported PHP/Symfony versions in composer.json.

    - path: ".github/workflows/**"
      instructions: |
        GitHub Actions workflows for this repository. Match existing workflow style (checkout@v6, matrix exclusions).
        Do not echo secrets. Pin third-party actions to major versions already used in this repo.

  tools:
    phpstan:
      enabled: true
    phpcs:
      enabled: false
    phpmd:
      enabled: false
    yamllint:
      enabled: true
    hadolint:
      enabled: true
    gitleaks:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 900000
    actionlint:
      enabled: true
    zizmor:
      enabled: true

knowledge_base:
  learnings:
    scope: auto
  pull_requests:
    scope: auto
